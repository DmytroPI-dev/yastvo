name: Build and Deploy Django Application to Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Use repository variables for the app name for reusability
env:
  APP_NAME: ${{ vars.APP_NAME || 'cafe' }}
  SUBDOMAIN: ${{ vars.SUBDOMAIN || 'cafe' }}

jobs:
  build:
    name: Package Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          touch deploy-package.tar.gz
          tar --exclude-from='.gitignore' \
              --exclude='.git' \
              --exclude='venv' \
              --exclude='deploy-package.tar.gz' \
              -czf deploy-package.tar.gz .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deploy-package
          path: deploy-package.tar.gz

  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deploy-package

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa_oracle
          chmod 600 ~/.ssh/id_rsa_oracle
          echo "SSH_KEY_PATH=~/.ssh/id_rsa_oracle" >> $GITHUB_ENV

      - name: Upload deployment package and scripts to VM
        run: |
          scp -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no deploy-package.tar.gz ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/
          scp -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no scripts/*.sh ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/
          ssh -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} "chmod +x /tmp/*.sh"

      - name: Step 1 - Provision Infrastructure
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "APP_NAME=${{ env.APP_NAME }} \
             PROJECT_DIR=/home/${{ secrets.ORACLE_USER }}/${{ env.APP_NAME }} \
             DB_NAME=${{ env.APP_NAME }}_db \
             DB_USER=${{ env.APP_NAME }}_user \
             DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
             SUBDOMAIN=${{ env.SUBDOMAIN }} \
             DOMAIN_NAME=${{ secrets.DOMAIN_NAME }} \
             DOMAIN_FQDN=${{ env.SUBDOMAIN }}.${{ secrets.DOMAIN_NAME }} \
             EMAIL=${{ secrets.EMAIL }} \
             /tmp/provision_infrastructure.sh"

      - name: Step 2 - Setup Gunicorn Service
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "APP_NAME=${{ env.APP_NAME }} \
             PROJECT_DIR=/home/${{ secrets.ORACLE_USER }}/${{ env.APP_NAME }} \
             VENV_DIR=/home/${{ secrets.ORACLE_USER }}/${{ env.APP_NAME }}/venv \
             DEPLOY_USER=${{ secrets.ORACLE_USER }} \
             /tmp/setup_gunicorn.sh"

      - name: Step 3 - Deploy Application
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "APP_NAME=${{ env.APP_NAME }} \
             PROJECT_DIR=/home/${{ secrets.ORACLE_USER }}/${{ env.APP_NAME }} \
             VENV_DIR=/home/${{ secrets.ORACLE_USER }}/${{ env.APP_NAME }}/venv \
             DEPLOY_USER=${{ secrets.ORACLE_USER }} \
             BACKEND_ENV_VARS='${{ secrets.BACKEND_ENV_VARS }}' \
             /tmp/deploy_app.sh"
